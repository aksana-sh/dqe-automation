[pytest]
# marks
markers =
    validate_csv: mark tests that validate data.csv
    unmarked: tests without explicit marks

# tests folder
testpaths =
    .

# python_files
python_files = test_*.py
python_functions = test_*

# addopts
addopts = --strict-markers --tb=short --html=report.html

# report portal
rp_endpoint = https://reportportal.epam.com
rp_launch = Pytest_First_Launch
rp_project = aksana_shchukina_personal
rp_log_batch_size = 20