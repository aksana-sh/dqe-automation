[pytest]

# Teats folder
testpaths = tests

# Test files
python_files = test_*.py
python_functions = test_*

# Custom marks
markers =
    parquet_data: tests for parquet files validation
    smoke: lightweight smoke tests
    facility_name_min_time_spent_per_visit_date: dataset-specific tests
    facility_type_avg_time_spent_per_visit_date: dataset-specific tests
    patient_sum_treatment_cost_per_facility_type: dataset-specific tests

# Addopts
addopts =
    --db_host=localhost
    --db_port=5434
    --db_name=mydatabase
    --db_user=myuser
    --db_password=mypassword
    --html=html_report/report.html
