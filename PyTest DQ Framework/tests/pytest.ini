[pytest]

# Teats folder
testpaths = tests

# Test files
python_files = test_*.py
python_functions = test_*

# Custom marks
markers =
    parquet_data: tests for parquet files validation

# Addopts
addopts =
    --db_host=localhost
    --db_port=5434
    --db_name=mydatabase
    --db_user=myuser
    --db_password=mypassword
    --html=html_report/report.html
